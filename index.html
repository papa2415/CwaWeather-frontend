    <style>

      .city-wrap {

    <!-- ✅ 背景層 -->
    <div class="bg-scene" aria-hidden="true"></div>
    <div class="bg-overlay" aria-hidden="true"></div>

    <div id="loading" class="loading-screen" aria-live="polite">
      <div class="loading-bubble">
        <div style="font-size: 3.2rem; animation: bounce 2s infinite">📌</div>
        <p id="loadingTitle" style="color: rgba(63, 58, 53, 0.82); font-weight: 900; margin-top: 10px">正在更新島上看板...</p>
        <p id="loadingSub" style="color: rgba(63, 58, 53, 0.56); font-weight: 800; margin-top: 6px; font-size: 0.88rem">小島氣象台整理中 ✨</p>
      </div>
    </div>

    <header class="status-bar">
      <div class="status-inner">
        <div class="city-wrap">
          <div class="location-pill" id="cityLabel">📍</div>
          <select id="citySelect" class="city-select" aria-label="選擇地區"></select>
        </div>

        <div id="updateTime" class="update-pill">更新中...</div>
      </div>
    </header>

    <main class="container" id="mainContent" aria-busy="true">
      <div id="heroCard"></div>
      <div id="detailPanels"></div>

      <h2 class="section-title">36 小時預報時間軸</h2>
      <div class="scroll-container" id="futureForecasts"></div>
    </main>

    <script>
      const API_BASE = "https://papa2415-weather.zeabur.app";
      const LS_KEY = "island_weather_city";

      /* ✅ 可視需求關閉遠端 Unsplash（例：上線要更穩，就改 false） */
      const ENABLE_REMOTE_BG = true;

      const $ = (sel, root = document) => root.querySelector(sel);

      function el(tag, opts = {}) {
        const node = document.createElement(tag);
        if (opts.className) node.className = opts.className;
        if (opts.text != null) node.textContent = String(opts.text);
        if (opts.attrs) {
          for (const [k, v] of Object.entries(opts.attrs)) {
            if (v == null) continue;
            node.setAttribute(k, String(v));
          }
        }
        return node;
      }

      function parseLocalDate(dtStr) {
        return new Date(String(dtStr || "").replace(" ", "T"));
      }

      function isValidDate(d) {
        return d instanceof Date && Number.isFinite(d.getTime());
      }

      function nTemp(v) {
        const n = Number.parseInt(String(v ?? ""), 10);
        return Number.isFinite(n) ? n : NaN;
      }

      function t(v) {
        const n = nTemp(v);
        return Number.isFinite(n) ? `${n}°` : "—";
      }

      function p(v) {
        const n = Number.parseInt(String(v ?? ""), 10);
        return Number.isFinite(n) ? `${n}%` : "—";
      }

      function fmtHM(dtStr) {
        const d = parseLocalDate(dtStr);
        if (!isValidDate(d)) return "—:—";
        const hh = String(d.getHours()).padStart(2, "0");
        const mm = String(d.getMinutes()).padStart(2, "0");
        return `${hh}:${mm}`;
      }

      function fmtRange(start, end) {
        return `${fmtHM(start)}–${fmtHM(end)}`;
      }

      function startOfDay(d) {
        return new Date(d.getFullYear(), d.getMonth(), d.getDate());
      }

      function getDayTag(startTime) {
        const d = parseLocalDate(startTime);
        if (!isValidDate(d)) return "—";
        const now = new Date();
        const diff = Math.round((startOfDay(d) - startOfDay(now)) / 86400000);
        if (diff === 0) return "今天";
        if (diff === 1) return "明天";
        return `${d.getMonth() + 1}/${d.getDate()}`;
      }

      function getTimePeriod(startTime) {
        const d = parseLocalDate(startTime);
        if (!isValidDate(d)) return "—";
        const hour = d.getHours();
        if (hour >= 5 && hour < 11) return "早晨";
        if (hour >= 11 && hour < 14) return "中午";
        if (hour >= 14 && hour < 18) return "下午";
        if (hour >= 18 && hour < 23) return "晚上";
        return "深夜";
      }

      function getAdvice(rainProb, maxTempNum) {
        let rainIcon = "🌂";
        let rainText = "輕裝出門";
        if (Number.parseInt(rainProb, 10) > 30) {
          rainIcon = "☂️";
          rainText = "帶把小傘";
        }

        let clothIcon = "👕";
        let clothText = "舒適穿搭";
        if (Number(maxTempNum) >= 28) {
          clothIcon = "🎽";
          clothText = "短袖出發";
        } else if (Number(maxTempNum) <= 20) {
          clothIcon = "🧥";
          clothText = "加件外套";
        }
        return { rainIcon, rainText, clothIcon, clothText };
      }

      /* =======================
       * ✅ SVG icons 常數化（避免每次 sticker() 都重新建立大字串）
       * ======================= */
      const STROKE = "#8A786A";
      const SO = "0.48";

      const CLOUD_GROUP = `
        <g fill="#E9F4F7" stroke="${STROKE}" stroke-opacity="${SO}" stroke-width="2.4" stroke-linejoin="round">
          <circle cx="24" cy="34" r="10"></circle>
          <circle cx="36" cy="30" r="12"></circle>
          <circle cx="48" cy="34" r="10"></circle>
          <rect x="16" y="34" width="40" height="14" rx="7"></rect>
        </g>
      `;

      const SUN_GROUP = `
        <g stroke="${STROKE}" stroke-opacity="${SO}" stroke-width="2.2" stroke-linecap="round">
          <circle cx="20" cy="22" r="8" fill="#F9F195"></circle>
          <line x1="20" y1="6" x2="20" y2="12" stroke="#F9F195" stroke-width="4"></line>
          <line x1="20" y1="32" x2="20" y2="38" stroke="#F9F195" stroke-width="4"></line>
          <line x1="4" y1="22" x2="10" y2="22" stroke="#F9F195" stroke-width="4"></line>
          <line x1="30" y1="22" x2="36" y2="22" stroke="#F9F195" stroke-width="4"></line>
          <line x1="9" y1="11" x2="13" y2="15" stroke="#F9F195" stroke-width="4"></line>
          <line x1="27" y1="29" x2="31" y2="33" stroke="#F9F195" stroke-width="4"></line>
          <line x1="31" y1="11" x2="27" y2="15" stroke="#F9F195" stroke-width="4"></line>
          <line x1="13" y1="29" x2="9" y2="33" stroke="#F9F195" stroke-width="4"></line>
        </g>
      `;

      const STICKER_ICONS = {
        sun: `<svg class="ac-sticker__svg" viewBox="0 0 64 64" aria-hidden="true">${SUN_GROUP}</svg>`,
        cloudy: `<svg class="ac-sticker__svg" viewBox="0 0 64 64" aria-hidden="true">${CLOUD_GROUP}</svg>`,
        partly: `
          <svg class="ac-sticker__svg" viewBox="0 0 64 64" aria-hidden="true">
            <g transform="translate(2,2)">${SUN_GROUP}</g>
            <g transform="translate(0,4)">${CLOUD_GROUP}</g>
          </svg>
        `,
        rain: `
          <svg class="ac-sticker__svg" viewBox="0 0 64 64" aria-hidden="true">
            ${CLOUD_GROUP}
            <g fill="none" stroke="#4FB5D9" stroke-width="3.6" stroke-linecap="round">
              <path d="M24 50 C22 56, 26 58, 24 62"></path>
              <path d="M34 50 C32 56, 36 58, 34 62"></path>
              <path d="M44 50 C42 56, 46 58, 44 62"></path>
            </g>
          </svg>
        `,
        thunder: `
          <svg class="ac-sticker__svg" viewBox="0 0 64 64" aria-hidden="true">
            ${CLOUD_GROUP}
            <path d="M34 40 L26 52 L36 52 L30 64 L48 46 L38 46 L44 40 Z"
              fill="#F9F195" stroke="${STROKE}" stroke-opacity="${SO}" stroke-width="2" stroke-linejoin="round"></path>
          </svg>
        `,
        unknown: `
          <svg class="ac-sticker__svg" viewBox="0 0 64 64" aria-hidden="true">
            <path d="M20 40c10-20 20-20 24 0c-10 10-14 10-24 0z" fill="#7DE1A9" stroke="${STROKE}" stroke-opacity="${SO}" stroke-width="2.4"></path>
          </svg>
        `,
      };

      function makeSticker(kind, label) {
        const wrap = el("span", { className: "ac-sticker", attrs: { role: "img", "aria-label": label || "天氣" } });
        // ✅ 這裡 innerHTML 只塞「自家常數 SVG」，不吃外部資料，安全範圍可控
        wrap.innerHTML = STICKER_ICONS[kind] || STICKER_ICONS.unknown;
        return wrap;
      }

      function getWeatherSticker(weather) {
        const w = String(weather || "");

        if (w.includes("雷")) return makeSticker("thunder", "雷");
        if (w.includes("雨")) return makeSticker("rain", "雨");

        if ((w.includes("晴") && w.includes("多雲")) || w.includes("多雲時晴") || w.includes("晴時多雲")) return makeSticker("partly", "多雲時晴");
        if (w.includes("多雲")) return makeSticker("partly", "多雲");
        if (w.includes("晴")) return makeSticker("sun", "晴");
        if (w.includes("陰") || w.includes("雲")) return makeSticker("cloudy", "陰");
        return makeSticker("unknown", "天氣");
      }

      /* =======================
       * ✅ Unsplash：可用就用，不可用就靠純 CSS 備援
       * - 加上 saveData / 低速網路判斷
       * - 使用 preload 拿 currentSrc 防止轉址造成二次 random
       * ======================= */
      let __bgToken = 0;
      let __lastBgKey = "";

      function escapeCssUrl(url) {
        return String(url).replaceAll('"', "%22").replaceAll("\\", "%5C").replaceAll("\n", "").replaceAll("\r", "");
      }

      function setCssBgVar(name, url) {
        document.documentElement.style.setProperty(name, url ? `url("${escapeCssUrl(url)}")` : "none");
      }

      function canUseRemoteBg() {
        if (!ENABLE_REMOTE_BG) return false;
        const c = navigator.connection;
        if (c?.saveData) return false;
        const et = String(c?.effectiveType || "");
        if (et.includes("2g")) return false;
        return true;
      }

      function setUnsplashTheme(weatherText, startTime) {
        if (!canUseRemoteBg()) {
          setCssBgVar("--scene-url", "");
          setCssBgVar("--wood-url", "");
          return;
        }

        const d = parseLocalDate(startTime);
        const hour = isValidDate(d) ? d.getHours() : 12;
        const isNight = hour >= 18 || hour < 5;

        const wt = String(weatherText || "");
        const wxKey = wt.includes("雷") ? "thunder" : wt.includes("雨") ? "rain" : wt.includes("晴") ? (wt.includes("雲") ? "partly" : "sun") : wt.includes("陰") || wt.includes("雲") ? "cloudy" : "fine";
        const key = `${isNight ? "night" : "day"}|${wxKey}`;
        if (key === __lastBgKey) return;
        __lastBgKey = key;

        const tags = [];
        if (isNight) tags.push("night", "village", "cozy", "warm-lights");
        else tags.push("island", "nature", "pastel", "sky");

        if (wt.includes("雨")) tags.push("rain", "forest");
        else if (wt.includes("雷")) tags.push("storm", "clouds");
        else if (wt.includes("陰")) tags.push("overcast", "green");
        else if (wt.includes("多雲")) tags.push("clouds", "sunlight");
        else if (wt.includes("晴")) tags.push("sunny", "blue-sky");

        const keywords = tags.join(",");
        const sig = Date.now();

        const sceneUrl = `https://source.unsplash.com/random/1600x900?${keywords}&sig=${sig}`;
        const woodUrl = `https://source.unsplash.com/random/1200x300?wood,texture&sig=${sig}`;

        preloadAndApplyBg(sceneUrl, woodUrl);
      }

      function preloadAndApplyBg(sceneUrl, woodUrl) {
        const token = ++__bgToken;

        const sceneImg = new Image();
        sceneImg.referrerPolicy = "no-referrer";
        sceneImg.decoding = "async";
        sceneImg.onload = () => {
          if (token !== __bgToken) return;
          const finalUrl = sceneImg.currentSrc || sceneImg.src;
          setCssBgVar("--scene-url", finalUrl);
        };
        sceneImg.onerror = () => {
          if (token !== __bgToken) return;
          setCssBgVar("--scene-url", "");
        };
        sceneImg.src = sceneUrl;

        const woodImg = new Image();
        woodImg.referrerPolicy = "no-referrer";
        woodImg.decoding = "async";
        woodImg.onload = () => {
          if (token !== __bgToken) return;
          const finalUrl = woodImg.currentSrc || woodImg.src;
          setCssBgVar("--wood-url", finalUrl);
        };
        woodImg.onerror = () => {
          if (token !== __bgToken) return;
          setCssBgVar("--wood-url", "");
        };
        woodImg.src = woodUrl;
      }

      /* ===== state ===== */
      const state = {
        forecasts: [],
        city: "",
        updateTime: "",
        selectedIndex: 0,
      };

      function setLoading(isLoading, title = "正在更新島上看板...", sub = "小島氣象台整理中 ✨") {
        const loading = $("#loading");
        const main = $("#mainContent");
        const select = $("#citySelect");

        $("#loadingTitle").textContent = title;
        $("#loadingSub").textContent = sub;

        loading.classList.toggle("is-visible", Boolean(isLoading));
        loading.setAttribute("aria-hidden", String(!isLoading));
        main.setAttribute("aria-busy", String(Boolean(isLoading)));
        if (select) select.disabled = Boolean(isLoading);
      }

      function buildHero(current, allMin, allMax) {
        const curMin = nTemp(current.minTemp);
        const curMax = nTemp(current.maxTemp);

        const span = Math.max(1, allMax - allMin);
        const leftPct = Number.isFinite(curMin) ? ((curMin - allMin) / span) * 100 : 0;
        const widthPct = Number.isFinite(curMin) && Number.isFinite(curMax) ? ((curMax - curMin) / span) * 100 : 0;

        const period = getTimePeriod(current.startTime);
        const avgTemp = Number.isFinite(curMin) && Number.isFinite(curMax) ? Math.round((curMax + curMin) / 2) : "—";

        const advice = getAdvice(current.rain, curMax);

        const section = el("section", { className: "hero-card", attrs: { "aria-label": "目前時段天氣" } });

        section.appendChild(el("div", { className: "hero-period", text: period }));

        const tempRow = el("div", { className: "hero-temp-container" });
        const iconWrap = el("div", { className: "hero-icon" });
        iconWrap.appendChild(getWeatherSticker(current.weather));
        tempRow.appendChild(iconWrap);
        tempRow.appendChild(el("div", { className: "hero-temp", text: `${avgTemp}°` }));
        section.appendChild(tempRow);

        section.appendChild(el("div", { className: "hero-desc", text: current.weather || "" }));

        const chips = el("div", { className: "hero-chips" });
        chips.appendChild(el("span", { className: "chip", text: `🕒 ${getDayTag(current.startTime)} ${fmtRange(current.startTime, current.endTime)}` }));
        chips.appendChild(el("span", { className: "chip", text: `🍃 ${current.comfort || "體感資料不足"}` }));
        chips.appendChild(el("span", { className: "chip", text: `🌡️ ${t(current.minTemp)} ~ ${t(current.maxTemp)}` }));
        section.appendChild(chips);

        const meter = el("div", { className: "meter", attrs: { "aria-label": "溫度區間相對位置" } });
        const meterLabel = el("div", { className: "meter-label" });
        meterLabel.appendChild(el("span", { text: `整體最低 ${allMin}°` }));
        meterLabel.appendChild(el("span", { text: `整體最高 ${allMax}°` }));
        meter.appendChild(meterLabel);

        const track = el("div", { className: "meter-track" });
        const range = el("div", { className: "meter-range" });
        range.style.left = `${leftPct}%`;
        range.style.width = `${widthPct}%`;
        track.appendChild(range);
        meter.appendChild(track);
        section.appendChild(meter);

        const adviceGrid = el("div", { className: "advice-grid" });

        const a1 = el("div", { className: "advice-item" });
        a1.appendChild(el("div", { className: "advice-icon", text: advice.rainIcon }));
        a1.appendChild(el("div", { className: "advice-text", text: advice.rainText }));
        a1.appendChild(el("div", { className: "advice-sub", text: `降雨率 ${p(current.rain)}` }));

        const a2 = el("div", { className: "advice-item" });
        a2.appendChild(el("div", { className: "advice-icon", text: advice.clothIcon }));
        a2.appendChild(el("div", { className: "advice-text", text: advice.clothText }));
        a2.appendChild(el("div", { className: "advice-sub", text: `最高溫 ${t(current.maxTemp)}` }));

        adviceGrid.appendChild(a1);
        adviceGrid.appendChild(a2);
        section.appendChild(adviceGrid);

        return section;
      }

      function buildDetails(current) {
        const windText = current.windSpeed ? current.windSpeed : "—";

        const section = el("section", { className: "detail-card", attrs: { "aria-label": "島上細節" } });
        section.appendChild(el("div", { className: "detail-title", text: "島上小情報" }));

        const grid = el("div", { className: "stats-grid" });

        const mkStat = (ic, name, val) => {
          const s = el("div", { className: "stat" });
          s.appendChild(el("div", { className: "stat-ic", text: ic }));
          const meta = el("div", { className: "stat-meta" });
          meta.appendChild(el("div", { className: "stat-name", text: name }));
          meta.appendChild(el("div", { className: "stat-val", text: val }));
          s.appendChild(meta);
          return s;
        };

        grid.appendChild(mkStat("💧", "降雨機率", p(current.rain)));
        grid.appendChild(mkStat("🌡️", "溫度區間", `${t(current.minTemp)} ~ ${t(current.maxTemp)}`));
        grid.appendChild(mkStat("🧣", "體感描述", current.comfort || "—"));
        grid.appendChild(mkStat("🌬️", "風速", windText));
        section.appendChild(grid);

        const tip = el("div", { className: "islander-tip" });
        tip.appendChild(el("div", { className: "islander-tip__title", text: "🗣️ 島民提醒" }));

        const rain = Number.parseInt(current.rain, 10);
        const maxT = nTemp(current.maxTemp);
        const comfort = String(current.comfort || "");

        const lines = [];
        if (Number.isFinite(rain) && rain >= 30) lines.push("🌧️ 可能會下點雨，備個小傘比較安心。");
        else lines.push("🟡 降雨機率不高，可以輕裝出門。");

        if (Number.isFinite(maxT) && maxT <= 18) lines.push("🧥 溫度偏涼，建議加件外套。");
        else if (Number.isFinite(maxT) && maxT >= 28) lines.push("🧊 可能偏熱，短袖 + 補水最舒服。");
        else lines.push("👕 體感剛好，薄外套隨身即可。");

        if (comfort) lines.push(`💬 體感：${comfort}`);

        lines.forEach((txt) => tip.appendChild(el("div", { className: "islander-tip__line", text: txt })));
        section.appendChild(tip);

        return section;
      }

      function buildMiniCard(f, idx, isActive) {
        const tag = getDayTag(f.startTime);
        const label = tag + getTimePeriod(f.startTime);

        const card = el("div", {
          className: `mini-card${isActive ? " is-active" : ""}`,
          attrs: { "data-idx": idx, role: "button", tabindex: "0", "aria-pressed": String(Boolean(isActive)) },
        });

        card.appendChild(el("div", { className: "mini-time", text: label }));

        const icon = el("div", { className: "mini-icon" });
        icon.appendChild(getWeatherSticker(f.weather));
        card.appendChild(icon);

        card.appendChild(el("div", { className: "mini-temp", text: `${t(f.minTemp)} - ${t(f.maxTemp)}` }));
        card.appendChild(el("div", { className: "mini-time-2", text: `🕒 ${fmtRange(f.startTime, f.endTime)}` }));
        card.appendChild(el("div", { className: "mini-sub", text: `💧 ${p(f.rain)}　🍃 ${f.comfort || "—"}` }));

        return card;
      }

      function render() {
        const forecasts = state.forecasts;
        if (!Array.isArray(forecasts) || forecasts.length === 0) return;

        const idx = Math.min(Math.max(0, state.selectedIndex), forecasts.length - 1);
        state.selectedIndex = idx;
        const current = forecasts[idx];

        setUnsplashTheme(current.weather, current.startTime);

        const mins = forecasts.map((f) => nTemp(f.minTemp)).filter(Number.isFinite);
        const maxs = forecasts.map((f) => nTemp(f.maxTemp)).filter(Number.isFinite);
        const allMin = mins.length ? Math.min(...mins) : 0;
        const allMax = maxs.length ? Math.max(...maxs) : 1;

        const heroHost = $("#heroCard");
        heroHost.replaceChildren(buildHero(current, allMin, allMax));

        const detailHost = $("#detailPanels");
        detailHost.replaceChildren(buildDetails(current));

        const scrollContainer = $("#futureForecasts");
        const frag = document.createDocumentFragment();
        forecasts.forEach((f, i) => frag.appendChild(buildMiniCard(f, i, i === idx)));
        scrollContainer.replaceChildren(frag);

        const now = new Date();
        const month = now.getMonth() + 1;
        const date = now.getDate();
        const dayIndex = now.getDay();
        const days = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];
        $("#updateTime").textContent = `${month}月${date}日 ${days[dayIndex]} · ${state.updateTime || "36 小時預報"}`;

        $("#cityLabel").textContent = `📍 ${state.city || ""}`;
        document.title = `${state.city || "台灣"} 36 小時預報｜島島天氣看板`;
      }

      function renderWeather(data) {
        state.forecasts = data.forecasts || [];
        state.city = data.city || "";
        state.updateTime = data.updateTime || "";
        state.selectedIndex = 0;
        render();
      }

      async function loadLocations() {
        const select = $("#citySelect");
        select.replaceChildren(el("option", { text: "載入地區中...", attrs: { value: "" } }));

        try {
          const res = await fetch(`${API_BASE}/api/locations`, { cache: "no-store" });
          const json = await res.json();
          if (!json?.success) throw new Error("LOCATIONS_API_ERROR");

          const frag = document.createDocumentFragment();
          json.data.forEach((item) => {
            frag.appendChild(el("option", { text: item.name, attrs: { value: item.value } }));
          });
          select.replaceChildren(frag);
        } catch (e) {
          console.error(e);
          const fallback = ["臺北市", "新北市", "桃園市", "臺中市", "臺南市", "高雄市", "宜蘭縣"];
          const frag = document.createDocumentFragment();
          fallback.forEach((c) => frag.appendChild(el("option", { text: c, attrs: { value: c } })));
          select.replaceChildren(frag);
        }
      }

      function getInitialCity() {
        const qs = new URLSearchParams(location.search);
        const fromQS = qs.get("city");
        if (fromQS) return fromQS;
        const fromLS = localStorage.getItem(LS_KEY);
        if (fromLS) return fromLS;
        return "高雄市";
      }

      function syncUrlCity(city) {
        const url = new URL(location.href);
        url.searchParams.set("city", city);
        history.replaceState(null, "", url.toString());
      }

      /* =======================
       * ✅ AbortController：使用者快速切換城市時取消舊請求，避免競態
       * ======================= */
      let activeCtrl = null;
      let activeReqId = 0;

      async function fetchWeather(city) {
        const select = $("#citySelect");
        const chosen = city || select.value || "高雄市";

        const myReqId = ++activeReqId;

        if (activeCtrl) activeCtrl.abort();
        const ctrl = new AbortController();
        activeCtrl = ctrl;

        setLoading(true, "正在更新島上看板...", `準備觀測：${chosen}`);

        let hideInFinally = true;

        try {
          const url = `${API_BASE}/api/weather?city=${encodeURIComponent(chosen)}`;
          const res = await fetch(url, { cache: "no-store", signal: ctrl.signal });
          const json = await res.json();

          if (myReqId !== activeReqId) return;
          if (!json?.success) throw new Error(json?.message || "WEATHER_API_ERROR");

          renderWeather(json.data);

          if (select && json.data?.city) select.value = json.data.city;
          localStorage.setItem(LS_KEY, json.data?.city || chosen);
          syncUrlCity(json.data?.city || chosen);
        } catch (e) {
          if (e?.name === "AbortError") return;
          console.error(e);

          if (myReqId !== activeReqId) return;

          hideInFinally = false;
          setLoading(true, "載入失敗", "可能是網路不穩或服務忙碌，稍後再試（可重新整理）");
          setTimeout(() => {
            if (myReqId === activeReqId) setLoading(false);
          }, 1200);
        } finally {
          if (myReqId === activeReqId) {
            activeCtrl = null;
            if (hideInFinally) setLoading(false);
          }
        }
      }

      async function init() {
        setLoading(true, "正在準備地區清單...", "小島資料整理中 ✨");
        await loadLocations();

        const select = $("#citySelect");
        const initialCity = getInitialCity();
        const has = Array.from(select.options).some((o) => o.value === initialCity);
        if (has) select.value = initialCity;

        select.addEventListener("change", () => fetchWeather(select.value));

        /* ✅ mini-card 事件代理 + 鍵盤可用 */
        const scroller = $("#futureForecasts");
        scroller.addEventListener("click", (ev) => {
          const card = ev.target.closest(".mini-card");
          if (!card) return;
          const idx = Number(card.dataset.idx);
          if (!Number.isFinite(idx)) return;
          state.selectedIndex = idx;
          render();
        });
        scroller.addEventListener("keydown", (ev) => {
          if (ev.key !== "Enter" && ev.key !== " ") return;
          const card = ev.target.closest(".mini-card");
          if (!card) return;
          ev.preventDefault();
          const idx = Number(card.dataset.idx);
          if (!Number.isFinite(idx)) return;
          state.selectedIndex = idx;
          render();
        });

        await fetchWeather(select.value || initialCity);
      }

      document.addEventListener("DOMContentLoaded", init);
    </script>
  </body>
</html>
